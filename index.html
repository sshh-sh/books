<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>송희의 독서목록</title>
<style>
@font-face{
  font-family:"Jalnan2";
  src:url("fonts/Jalnan2-normal.otf") format("opentype");
  font-weight:normal;
  font-display:swap;
}
@font-face{
  font-family:"NanumSquareRound";
  src:url("fonts/NanumSquareRound-400.otf") format("opentype");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:"NanumSquareRound";
  src:url("fonts/NanumSquareRound-700.otf") format("opentype");
  font-weight:700;
  font-display:swap;
}
@font-face{
  font-family:"NanumDaSi";
  src:url("fonts/NanumDaSi-normal.ttf") format("truetype");
  font-weight:normal;
  font-display:swap;
}
:root{
  --title-font: "Jalnan2", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif;
  --pen-font: "NanumDaSi", "NanumSquareRound", sans-serif;
  --bg:#faf0f3;
  --surface:#ffffff;
  --ink:#2b292d;
  --ink-soft:#736d78;
  --line:#ecd9e0;
  --accent:#b8215e;
  --accent-soft:#f6dde6;
  --gold:#c9a25a;
  --danger:#9c3d55;
  --ok:#4f7a68;
  --radius:10px;
  --display: "NanumSquareRound", "Apple SD Gothic Neo", sans-serif;
  --sans: "NanumSquareRound", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
  --mono: "NanumSquareRound", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
@media (min-width:900px){
  body{font-size:1.08rem;}
  .app{max-width:820px;}
}

.app-sticky-header{position:sticky;top:0;z-index:20;background:var(--bg);}
header.top{
  display:flex;align-items:center;gap:10px;
  padding:22px 24px 16px;border-bottom:1px solid var(--line);
}
.header-spacer{flex:1;}
header.top .brand-link{
  display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;
}
header.top .brand-icon{width:58px;height:auto;border-radius:12px;object-fit:cover;flex-shrink:0;display:block;}
header.top .brand-text{display:flex;align-items:baseline;gap:7px;}
header.top h1.brand{
  font-family:var(--title-font);font-size:1.5rem;margin:0;font-weight:normal;line-height:1;
  color:var(--accent);
}
header.top .brand-link:hover h1.brand{opacity:0.8;}
header.top .brand-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
header.top .brand-sub{
  font-family:var(--title-font);font-size:0.78rem;color:var(--ink-soft);line-height:1;
}

nav.tabs{
  display:flex;align-items:center;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);
  overflow-x:auto;background:var(--bg);
}
nav.tabs button.tab-btn{
  appearance:none;border:none;background:none;color:var(--ink-soft);
  font-family:var(--title-font);font-size:0.92rem;padding:12px 14px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;font-weight:normal;
}
@media (min-width:900px){
  nav.tabs{gap:10px;}
  nav.tabs button.tab-btn{font-size:1.02rem;padding:14px 16px;}
}
nav.tabs button.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.tabs-spacer{flex:1;}
.search-toggle{
  flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:0.82rem;
  font-weight:600;cursor:pointer;margin:8px 0;
}
.search-toggle:hover{border-color:var(--accent);}
.search-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

main{flex:1;padding:22px 24px 60px;}
.view{display:none;}
.view.active{display:block;}

/* ---- 상단 검색 (팝오버) ---- */
.search-popover{
  display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:16px;
}
.search-popover.open{display:block;}
.search-close-btn{
  flex-shrink:0;width:38px;padding:0;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  font-size:1.1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.search-close-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.search-bar{display:flex;gap:8px;min-width:0;}
.search-bar input{
  flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:0.9rem;
}
.search-bar input:focus-visible{outline:2px solid var(--accent);}
.search-bar button{
  padding:10px 18px;border-radius:999px;border:none;background:var(--accent);color:var(--surface);
  font-weight:600;font-size:0.85rem;cursor:pointer;
}
.search-results{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  margin-top:10px;overflow:hidden;
}
.result-row{
  display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;
}
.result-row .add-btn, .result-row .already-tag{margin-top:2px;}
.result-blurb{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
.result-row:last-child{border-bottom:none;}
.result-row .book-meta{flex:1;}
.add-btn{
  border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;
  padding:8px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;white-space:nowrap;
}
.add-btn:hover{background:var(--accent-soft);}
.add-btn:disabled{cursor:default;}
.add-btn.added{border-color:var(--ok);color:var(--ok);background:none;}
.add-btn.added:hover{background:none;}
.barcode-btn{
  flex-shrink:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:0.85rem;
  font-weight:600;cursor:pointer;white-space:nowrap;
}
.barcode-btn:hover{border-color:var(--accent);}
.already-tag{
  font-size:0.75rem;color:var(--ink-soft);font-family:var(--sans);white-space:nowrap;flex-shrink:0;
}

/* ---- 토스트 안내 ---- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
  background:var(--accent);color:#fff;padding:11px 22px;border-radius:999px;
  font-family:var(--sans);font-size:0.85rem;font-weight:600;text-align:center;
  max-width:86vw;box-shadow:0 8px 20px rgba(0,0,0,.18);
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- 도서관 지점 필터 ---- */
.branch-toolbar{
  display:flex;align-items:center;gap:4px;margin-bottom:10px;flex-wrap:nowrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;
}
.branch-row{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;flex-shrink:0;}
.branch-row-spacer{display:none;}
.branch-row .chip-select.dragging{opacity:0.4;}
.chip-select{
  font-family:var(--sans);font-size:0.78rem;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 10px;cursor:grab;user-select:none;white-space:nowrap;flex-shrink:0;
}
.chip-select.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.chip-select.dragging{opacity:0.4;}
.chip-select.drag-over{border-color:var(--accent);border-style:dashed;}
.more-branch-btn{
  font-family:var(--sans);font-size:0.78rem;color:var(--ink-soft);
  background:none;border:1px dashed var(--line);border-radius:999px;
  padding:6px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.more-branch-btn:hover{border-color:var(--accent);color:var(--accent);}

.list-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.count-row{margin-bottom:14px;}
.want-count{
  display:inline-block;font-family:var(--sans);font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;
  background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
}

.sort-row{margin-bottom:14px;}
.sort-toggle{
  font-family:var(--sans);font-size:0.8rem;color:var(--ink-soft);
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;
}
.sort-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.sort-combo{
  font-family:var(--sans);font-size:0.78rem;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 10px;cursor:pointer;flex-shrink:0;
}
.branch-toolbar .sort-combo{max-width:118px;}

/* ---- 맨 위/아래 이동 버튼 ---- */
/* 화면 세로 중앙(top:50%)에 두면 종합해용 히트맵의 12월 칸 위에 딱 겹쳐서 숫자를 가림 →
   콘텐츠가 거의 없는 우측 하단으로 내림(엄지로 누르기도 더 편함) */
.scroll-nav{
  position:fixed;right:10px;bottom:22px;
  display:flex;flex-direction:column;gap:6px;z-index:50;
}
.scroll-nav button{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  font-size:0.75rem;line-height:1;cursor:pointer;opacity:0.75;
  display:flex;align-items:center;justify-content:center;
}
.scroll-nav button:hover{opacity:1;border-color:var(--accent);color:var(--accent);}

/* ---- 책 카드 (읽을래용) ---- */
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.book-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s;position:relative;
}
.book-card .cover-col{width:100%;}
.book-card .cover{width:64%;max-width:90px;height:auto;aspect-ratio:2/3;margin:0 auto;}
.book-card:hover{border-color:var(--accent);}
.book-card .kebab-wrap{position:absolute;top:8px;right:8px;}
.kebab-btn{
  background:none;border:none;color:var(--ink-soft);font-size:1.1rem;cursor:pointer;
  padding:2px 8px;line-height:1;border-radius:6px;
}
.kebab-btn:hover{background:var(--accent-soft);color:var(--accent);}
.kebab-menu{
  display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.12);
  min-width:150px;z-index:5;overflow:hidden;
}
.kebab-menu.open{display:block;}
.kebab-menu button{
  display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;
  font-size:0.82rem;color:var(--ink);cursor:pointer;
}
.kebab-menu button:hover{background:var(--accent-soft);}
.kebab-menu button.danger-opt{color:var(--danger);}
.book-card.dropped{border-color:var(--danger);}
.cover-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
.cover{
  width:56px;height:80px;border-radius:4px;flex-shrink:0;
  background:linear-gradient(160deg,var(--accent-soft),var(--line));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:0.66rem;color:var(--ink-soft);text-align:center;line-height:1.2;
  overflow:hidden;padding:4px;
}
.book-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;}
.book-title{font-family:var(--display);font-size:1rem;font-weight:700;line-height:1.3;letter-spacing:-0.01em;}
.book-author-year{font-size:0.78rem;color:var(--ink-soft);}
.callno{font-family:var(--mono);font-size:0.72rem;color:var(--accent);}
.blurb{font-size:0.8rem;color:var(--ink-soft);line-height:1.4;margin-top:2px;}
.avail-badge{font-family:var(--mono);font-size:0.7rem;display:flex;align-items:center;gap:5px;margin-top:2px;}
.avail-lines{font-size:0.74rem;color:var(--ink);margin-top:2px;line-height:1.5;}
.al-label{color:var(--ink-soft);margin-right:4px;}
.site-footer{
  text-align:center;font-size:0.7rem;color:var(--ink-soft);opacity:0.75;
  padding:14px 20px 22px;border-top:1px solid var(--line);
}
.empty-msg{color:var(--ink-soft);font-size:0.85rem;padding:20px 0;text-align:center;}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot.ok{background:var(--ok);}
.dot.no{background:var(--danger);}

.borrow-check{
  display:flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--ink-soft);
}
.borrow-check input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;}
.borrow-check.checked{color:var(--accent);font-weight:600;}
.reason-input{
  margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);
}
.reason-input textarea{
  width:100%;border:none;background:none;color:var(--ink);font-family:var(--pen-font);
  font-size:1.05rem;letter-spacing:-0.02em;resize:none;padding:0;line-height:1.4;
}
.reason-input textarea.empty{min-height:1.4em;}
.reason-input textarea::placeholder{color:var(--ink-soft);font-family:var(--sans);font-size:0.95rem;}
.reason-input textarea:focus-visible{outline:none;}
.status-pill{
  font-size:0.68rem;padding:2px 7px;border-radius:999px;font-weight:600;width:fit-content;
}
.status-borrowed{background:#f0e6c8;color:#8a6d1a;}
.status-done{background:#dcefe3;color:var(--ok);}
.status-dropped{background:#f2e0dc;color:var(--danger);}

/* ---- 읽었어용 (월별 아이콘 그리드) ---- */
.month-group{margin-bottom:30px;}
.month-header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.month-header .m-name{font-family:var(--display);font-size:1.05rem;font-weight:800;flex-shrink:0;letter-spacing:-0.01em;}
.month-header .m-count{font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);flex-shrink:0;}
.month-header .m-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.month-header .m-bar-fill{height:100%;background:var(--accent);}

.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px 12px;}
.record-tile{cursor:pointer;text-align:center;position:relative;}
.record-tile .cover{
  width:100%;height:auto;aspect-ratio:2/3;position:relative;font-size:0.6rem;border-radius:6px;
}
.tile-remove-btn{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;z-index:2;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  font-size:0.7rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .1s;
}
.record-tile:hover .tile-remove-btn{opacity:1;}
.tile-remove-btn:hover{border-color:var(--danger);color:var(--danger);}
.record-tile .memo-flag{position:absolute;top:3px;right:3px;font-size:0.8rem;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));}
.record-tile .r-title{
  font-size:0.74rem;font-weight:700;margin-top:6px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.record-tile .r-series{font-family:var(--mono);font-size:0.62rem;color:var(--accent);margin-top:1px;}
.record-tile .r-date{font-family:var(--mono);font-size:0.64rem;color:var(--ink-soft);margin-top:2px;}
.record-tile.dropped .cover{opacity:0.5;}
.record-tile.dropped .r-title{color:var(--danger);}
.record-tile.dropped .r-date{color:var(--danger);}

/* ---- 상세 모달 ---- */
.overlay{
  position:fixed;inset:0;background:rgba(20,18,14,0.45);display:none;
  align-items:flex-start;justify-content:center;padding:150px 16px 40px;overflow-y:auto;z-index:30;
}
.overlay.active{display:flex;}
.detail-card{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:28px;
  border:1px solid var(--line);
}
.detail-head{display:flex;gap:18px;}
.detail-head .cover{width:84px;height:120px;font-size:0.75rem;object-fit:cover;}
.detail-title{font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:-0.01em;}
.detail-author{color:var(--ink-soft);font-size:0.9rem;margin-top:4px;}
.close-x{margin-left:auto;background:none;border:none;color:var(--ink-soft);font-size:1.3rem;cursor:pointer;line-height:1;}
.field-block{margin-top:20px;}
.field-label{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:6px;}
.note-box{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:0.88rem;line-height:1.5;
}
.lib-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:0.85rem;gap:10px;}
.lib-row:last-child{border-bottom:none;}
.lib-name{flex:1;}
.lib-callno{font-family:var(--mono);font-size:0.75rem;color:var(--ink-soft);width:64px;}
.avail-tag{font-family:var(--mono);font-size:0.72rem;padding:2px 8px;border-radius:5px;flex-shrink:0;}
.avail-tag.ok{background:#dcefe3;color:var(--ok);}
.avail-tag.no{background:#f2e0dc;color:var(--danger);}

/* ---- 읽음 기록 편집 모달 ---- */
.date-input{
  font-family:var(--mono);font-size:0.85rem;padding:7px 10px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
}
.memo-input{
  width:100%;margin-top:2px;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:1rem;font-family:var(--sans);resize:vertical;
}
.link-btn{
  background:none;border:none;color:var(--danger);font-size:0.8rem;cursor:pointer;
  padding:6px 0;text-decoration:underline;text-underline-offset:2px;
}
.link-btn.undo{color:var(--accent);}

/* ---- 바코드 스캔 ---- */
.scan-viewfinder{
  margin-top:16px;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:0.85rem;
  background:var(--bg);position:relative;overflow:hidden;padding:20px;text-align:center;
}
.scan-line{
  display:none;
  position:absolute;left:8%;right:8%;height:2px;background:var(--accent);
  box-shadow:0 0 8px var(--accent);animation:scan-sweep 1.8s ease-in-out infinite;z-index:2;
}
.scan-viewfinder.live .scan-line{display:block;}
#scan-video{position:absolute;inset:0;width:100%;height:100%;}
#scan-hint{
  position:relative;z-index:2;background:rgba(0,0,0,0.55);color:#fff;padding:4px 10px;
  border-radius:6px;
}
@keyframes scan-sweep{
  0%{top:15%;} 50%{top:85%;} 100%{top:15%;}
}
@media (prefers-reduced-motion: reduce){
  .scan-line{animation:none;top:50%;}
}
.focus-ring{
  position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;
  border:2px solid var(--accent);border-radius:50%;z-index:3;pointer-events:none;
  animation:focus-ring-anim 0.6s ease-out forwards;
}
@keyframes focus-ring-anim{
  0%{transform:scale(1.3);opacity:1;}
  100%{transform:scale(0.9);opacity:0;}
}
/* 카메라 조작 컨트롤(카메라 선택/줌/플래시) — 고정초점 렌즈를 우회하기 위한 수단들 */
.scan-controls{display:none;margin-top:10px;}
.scan-viewfinder.live ~ .scan-controls{display:block;}
.scan-ctl-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.scan-ctl-label{font-size:0.75rem;color:var(--ink-soft);white-space:nowrap;min-width:52px;}
.scan-ctl-row select{
  flex:1;min-width:0;font-family:var(--sans);font-size:0.8rem;padding:6px 8px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
}
.scan-ctl-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);}
.scan-torch-btn{
  font-family:var(--sans);font-size:0.78rem;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;
}
.scan-torch-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.scan-diag{
  margin-top:10px;font-family:var(--mono);font-size:0.68rem;line-height:1.5;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;word-break:break-all;white-space:pre-wrap;
}

/* ---- 종합해용 ---- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px;}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;min-width:0;}
@media (max-width:400px){.stat-grid{gap:6px;}.stat-tile{padding:10px 8px;}}
.stat-num{font-family:var(--mono);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-label{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
.mini-heading{font-family:var(--sans);font-size:0.8rem;color:var(--ink-soft);font-weight:600;}
.month-table{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 10px;}
/* 맨 오른쪽에 연도별 합계 열(계)을 두느라 12칸이 좁아져서 gap을 3→2px로 줄여 숫자 공간을 확보 */
.mt-grid{display:grid;grid-template-columns:25px repeat(12,1fr) 27px;gap:2px;align-items:center;}
.mt-grid .mt-mlabel{font-size:0.62rem;color:var(--ink-soft);text-align:center;}
.mt-grid .mt-ylabel{font-size:0.7rem;color:var(--ink-soft);white-space:nowrap;}
/* 합계 열 — 격자와 구분되게 왼쪽에 선을 두고 강조색 숫자로 */
.mt-thead{font-size:0.62rem;color:var(--ink-soft);text-align:center;}
.mt-total{
  display:flex;align-items:center;justify-content:center;height:100%;
  font-size:0.72rem;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;border-left:1px solid var(--line);
}
.mt-cell{
  aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:0.68rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft);
}
.month-divider{
  grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:0.95rem;color:var(--ink-soft);
  margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line);
}
.month-divider:first-child{border-top:none;margin-top:0;padding-top:0;}
.month-divider-count{font-weight:400;font-size:0.75rem;margin-left:4px;color:var(--ink-soft);}
.year-table{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;overflow-x:auto;}
.yt-row{display:flex;gap:4px;}
.yt-row + .yt-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.yt-row span{flex:1;text-align:center;min-width:36px;}
.yt-labels span{font-size:0.72rem;color:var(--ink-soft);}
.yt-values span{font-size:1rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.section-title{font-family:var(--display);font-size:1.1rem;font-weight:800;margin:28px 0 12px;letter-spacing:-0.01em;}
.category-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:0.72rem;}
.category-bar-row .lbl{width:36px;flex-shrink:0;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.category-bar-row .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:0;}
.category-bar-row .fill{height:100%;background:var(--accent);}
.category-bar-row .pct{width:30px;text-align:right;font-size:0.68rem;font-variant-numeric:tabular-nums;}

@media (max-width:640px){
  .app{padding-bottom:0;}
  nav.tabs{padding:0 12px;}
  main{padding:16px 12px 80px;}
  header.top{padding:20px 16px 14px;}
  .overlay{padding:130px 10px 20px;}
  .detail-card{padding:18px;}
  .book-grid{grid-template-columns:repeat(2,1fr);}
  .tile-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
/* ============ API 연동 (깃허브 페이지 → 앱스 스크립트) ============ */
const API_BASE = 'https://script.google.com/macros/s/AKfycbzzNbPguhf1dhI2BGgK_KlvPb154RVUB0khLF-2IpGIwRzqndTVYYk5gOYPhRM_qNa2/exec';

async function apiGet(action, params){
  const qs = new URLSearchParams(Object.assign({ action, _: Date.now() }, params||{}));
  const res = await fetch(API_BASE + '?' + qs.toString(), { cache: 'no-store' });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'API 오류');
  return json.data;
}
async function apiPost(action, payload){
  const res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 프리플라이트 회피
    body: JSON.stringify(Object.assign({ action }, payload||{}))
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'API 오류');
  return json.data;
}
/* 읽을래용/읽는중이용/읽었어용/종합해용/지점목록 중 여러 개를 동시에 새로고침해야 할 때
   (초기 로드, 상태 변경 후 등) 개별 apiGet을 따로따로 날리면 같은 스프레드시트에 대한
   동시 요청이 서버 쪽에서 큐잉되어 순서대로 밀림(5개 동시 호출 시 마지막 응답이 25초까지
   걸리는 걸 확인함). getBundle 액션으로 한 번에 모아 받아서 그 지연을 없앰.
   getBundle이 아직 없는 구버전 백엔드에 배포된 경우를 대비해, 실패하면 기존 방식(개별
   호출)으로 자동 폴백 — 배포 순서와 무관하게 항상 정상 동작하도록. */
async function apiGetBundle(parts){
  return await apiGet('getBundle', { parts: parts.join(',') });
}

/* 마지막으로 성공한 전체 목록을 브라우저에 저장해뒀다가, 다음에 열 때 네트워크 응답을
   기다리지 않고 그 화면부터 바로 보여줌(그 사이에 최신 데이터로 조용히 교체됨).
   실제 데이터는 여전히 서버가 정답이라, 여기 실패/무시는 그냥 매번 새로 받는 것과 같음. */
const BUNDLE_CACHE_KEY = 'bookAppBundleCache_v1';
function saveBundleCache_(d){
  try{ localStorage.setItem(BUNDLE_CACHE_KEY, JSON.stringify(d)); }catch(e){ /* 용량 초과 등은 무시 */ }
}
function loadBundleCache_(){
  try{
    const raw = localStorage.getItem(BUNDLE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function refreshParts_(parts){
  try{
    const d = await apiGetBundle(parts);
    if(parts.indexOf('want')!==-1) loadWant(d.want);
    if(parts.indexOf('reading')!==-1) loadReading(d.reading);
    if(parts.indexOf('done')!==-1) loadDone(d.done);
    if(parts.indexOf('stats')!==-1) loadStats(d.stats, d.done);
    if(parts.indexOf('branches')!==-1) loadBranches(d.branches);
  }catch(err){
    console.warn('getBundle 실패, 개별 호출로 폴백', err);
    if(parts.indexOf('want')!==-1) loadWant();
    if(parts.indexOf('reading')!==-1) loadReading();
    if(parts.indexOf('done')!==-1) loadDone();
    if(parts.indexOf('stats')!==-1) loadStats();
    if(parts.indexOf('branches')!==-1) loadBranches();
  }
}
/* 페이지를 열자마자 네트워크를 기다리지 않고, 마지막으로 저장해둔 캐시로 먼저 그려준 뒤
   실제 최신 데이터를 받아서 조용히 다시 그림(캐시가 없으면 지금까지처럼 그냥 기다림).
   화면이 항상 "최신 상태"로 끝나는 건 동일하고, 재방문 시 체감 로딩만 없어짐. */
async function initialLoad_(){
  const cached = loadBundleCache_();
  if(cached){
    if(cached.want) loadWant(cached.want);
    if(cached.reading) loadReading(cached.reading);
    if(cached.done) loadDone(cached.done);
    if(cached.stats) loadStats(cached.stats, cached.done);
    if(cached.branches) loadBranches(cached.branches);
  }
  try{
    const d = await apiGetBundle(['want','reading','done','stats','branches']);
    loadWant(d.want);
    loadReading(d.reading);
    loadDone(d.done);
    loadStats(d.stats, d.done);
    loadBranches(d.branches);
    saveBundleCache_(d);
  }catch(err){
    console.warn('getBundle 실패, 개별 호출로 폴백', err);
    loadWant(); loadReading(); loadDone(); loadStats(); loadBranches();
  }
}
function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showApiError(err){
  console.error(err);
  alert('문제가 생겼어요: ' + (err && err.message ? err.message : err));
}
/* 담기/추가 실패 처리 — 중복 등록 시도는 별도 안내(alert)만, 그 외 에러는 기존 방식대로 */
function handleAddError_(err){
  if(err && err.message === '이미 등록된 책이에요.'){ alert('이미 등록된 책이에요.'); return; }
  showApiError(err);
}
/* 버튼을 빠르게 두 번 누르면 등록 요청이 두 번 나가고, 서버가 둘 다 '중복 없음'으로 판단해
   같은 책이 두 줄 저장되는 일이 실제로 있었음(userBookId 315/316 등). 백엔드에도 잠금을 걸었지만
   요청 자체를 안 보내는 게 확실해서 앞단에서도 막음 — 처리 중이면 두 번째 호출은 그냥 무시. */
let addInFlight_ = false;
async function runAddOnce_(fn){
  if(addInFlight_) return;
  addInFlight_ = true;
  try{ await fn(); }
  catch(err){ handleAddError_(err); }
  finally{ addInFlight_ = false; }
}

/* ============ 탭 전환 ============ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

/* ============ 검색 팝오버 ============ */
function toggleSearch(){
  document.getElementById('search-popover').classList.toggle('open');
  document.querySelector('.search-toggle').classList.toggle('active');
}
/* X 버튼 전용 — 담기 완료 시엔 더 이상 이 함수를 부르지 않음(패널이 자동으로 안 닫히게).
   패널을 실제로 닫는 유일한 경로라, 여기서만 검색 상태(입력값·결과)를 다 지움 */

/* ============ 토스트 안내(alert 대신 잠깐 떴다 사라지는 인라인 메시지) ============ */
let toastTimer_ = null;
function showToast(message){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer_);
  toastTimer_ = setTimeout(() => el.classList.remove('show'), 2200);
}

/* 검색 결과 목록에서 담기가 끝난 줄의 버튼을 완료 상태로 바꿔줌(패널은 그대로 열어둠 —
   같은 검색 결과에서 여러 권을 연달아 담을 수 있도록) */
function markResultAdded_(i){
  const row = document.querySelector(`.result-row[data-idx="${i}"]`);
  if(!row) return;
  const btn = row.querySelector('.add-btn');
  if(!btn) return;
  btn.textContent = '✓ 담았어요';
  btn.disabled = true;
  btn.classList.add('added');
  btn.removeAttribute('onclick');
}

/* ============ 날짜 짧은 형식(YYMMDD, 예: 260731) 도우미 ============ */
function toShortDateStr_(d){
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return yy+mm+dd;
}
function parseShortDateStr_(raw){
  const digits = (raw||'').replace(/[^0-9]/g,'');
  if(digits.length === 6){
    return '20'+digits.slice(0,2)+'-'+digits.slice(2,4)+'-'+digits.slice(4,6);
  }
  if(digits.length === 8){
    return digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8);
  }
  return Utilities_todayIso_(); // 형식이 이상하면 오늘 날짜로
}
function Utilities_todayIso_(){ return new Date().toISOString().slice(0,10); }

/* ============ 탭 공통: 지금 보고 있는 탭이 무엇인지 ============ */
function activeTabView_(){
  const btn = document.querySelector('.tab-btn.active');
  return btn ? btn.dataset.view : 'want';
}

/* ============ 읽을래용: 검색 ============ */
let searchCache = [];
let doneAddPendingIndex_ = null;
async function doSearch(){
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  const box = document.getElementById('search-results');
  box.style.display = 'block';
  box.innerHTML = '<div class="empty-msg">검색 중...</div>';
  try{
    const items = await apiGet('searchAladin', { query: q });
    searchCache = items;
    if(!items.length){ box.innerHTML = '<div class="empty-msg">검색 결과가 없어요.</div>'; return; }
    const view = activeTabView_();
    const alreadyIsbns = new Set(
      (view === 'reading' ? readingCache : view === 'done' ? doneCache : wantCache).map(b=>b.isbn)
    );
    const addLabel = view === 'reading' ? '+ 읽는중 추가' : view === 'done' ? '+ 읽음 추가' : '+ 담기';
    const addFn = view === 'reading' ? 'addReadingFromSearch' : view === 'done' ? 'openDoneAdd' : 'addWant';
    box.innerHTML = items.map((it,i)=>`
      <div class="result-row" data-idx="${i}">
        <img class="cover" src="${it.cover||''}" alt="">
        <div class="book-meta">
          <div class="book-title">${escapeHtml(it.title)}</div>
          <div class="book-author-year">${escapeHtml(it.author)} · ${escapeHtml(it.pubDate||'').slice(0,4)}</div>
          <div class="blurb result-blurb">${escapeHtml(it.description||'')}</div>
        </div>
        ${alreadyIsbns.has(it.isbn13)
          ? '<span class="already-tag">이미 담겨있어요</span>'
          : `<button class="add-btn" onclick="${addFn}(${i})">${addLabel}</button>`}
      </div>
    `).join('');
  }catch(err){ showApiError(err); box.innerHTML = '<div class="empty-msg">검색 중 오류가 났어요.</div>'; }
}
async function addWant(i){
  const item = searchCache[i];
  await runAddOnce_(async () => {
    await apiPost('addToWantList', { bookData: item, reasonNote: '' });
    markResultAdded_(i);
    showToast(`『${item.title}』을(를) 읽을래용에 담았어요`);
    loadWant();
  });
}

/* ============ 읽을래용: 목록 ============ */
let wantCache = [];
let bookLibrariesMap = {}; // book_id -> ['남사','수지',...] (보유 도서관 이름 목록, 필터용)
let bookCallnoMap = {}; // book_id -> {'남사':'813.6', '용인중앙':'813.62'} (지점별 청구기호, 남사/용인중앙만)
let activeBranchFilter = null; // null이면 전체
let wantSortMode = 'added_desc'; // added_desc|added_asc|title_asc|title_desc|callno_asc|callno_desc

function renderWantCount(){
  const el = document.getElementById('want-count');
  if(el) el.textContent = '읽고 싶은 책 ' + wantCache.length + '권';
}

  return `

async function loadWant(preloaded){
  const grid = document.getElementById('book-grid');
  try{
    const list = preloaded || await apiGet('getWantList');
    wantCache = list;
    renderWantCount();
    if(!list.length){ grid.innerHTML = '<div class="empty-msg">아직 담은 책이 없어요. 위에서 검색해서 담아보세요.</div>'; return; }
    grid.innerHTML = list.map(wantCardHtml).join('');
    applyBranchFilter();
    /* 목록 조회 응답에 이미 avail_json(캐시된 도서관 정보)이 같이 오므로, 있는 건 바로 렌더링하고
       없는 것만(캐시 만료/신규 등) 별도 API로 채움 — 예전엔 다 있는데도 카드마다 매번 새로 불러왔었음 */
    list.forEach(b => renderCachedAvailIfPresent_(b));
    setupAvailLazyLoad_();
  }catch(err){ showApiError(err); grid.innerHTML = '<div class="empty-msg">불러오지 못했어요.</div>'; }
}
function parseAvailJson_(raw){
  if(!raw || raw === 'ERROR') return null;
  try{ const libs = JSON.parse(raw); return Array.isArray(libs) ? libs : null; }catch(e){ return null; }
}
function renderAvailLibs_(b, libs){
  const box = document.getElementById('avail-'+b.userBook.id);
  if(!box) return;
  box.dataset.filled = '1';
  bookLibrariesMap[b.id] = libs.map(l=>l.libraryName);
  const callnoMap = {};
  libs.forEach(l=>{ if(l.callno) callnoMap[l.libraryName] = l.callno; });
  bookCallnoMap[b.id] = callnoMap;
  if(!libs.length){ box.innerHTML = '<div><span class="al-label">보유도서관</span> 없음</div>'; applyBranchFilter(); return; }
  const owned = libs.map(l=>l.libraryName).join(', ');
  const available = libs.filter(l=>l.available).map(l=>l.libraryName);
  box.innerHTML = `
    <div><span class="al-label">보유도서관</span> ${escapeHtml(owned)}</div>
    <div><span class="al-label">대출가능</span> ${available.length ? escapeHtml(available.join(', ')) : '없음'}</div>
  `;
  applyBranchFilter();
}
function renderCachedAvailIfPresent_(b){
  const libs = parseAvailJson_(b.avail_json);
  if(libs === null) return false;
  renderAvailLibs_(b, libs);
  return true;
}
/* 캐시가 없는 책만 그때그때 조회(화면에 실제로 보이는/곧 보일 카드만) */
let availObserver_ = null;
function setupAvailLazyLoad_(){
  if(availObserver_) availObserver_.disconnect();
  availObserver_ = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const card = entry.target;
      const b = findWantBook_(card.dataset.userBookId);
      if(b) loadAvailability(b);
      availObserver_.unobserve(card);
    });
  }, { rootMargin: '300px', threshold: 0.01 });
  document.querySelectorAll('#book-grid .book-card').forEach(card => {
    const box = document.getElementById('avail-'+card.dataset.userBookId);
    if(box && box.dataset.filled === '1') return; // 이미 캐시로 채워진 카드는 관찰 불필요
    availObserver_.observe(card);
  });
}
async function loadAvailability(b){
  const box = document.getElementById('avail-'+b.userBook.id);
  if(!box) return;
  if(!b.isbn){ box.innerHTML = ''; return; }
  try{
    const libs = await apiGet('getBookAvailabilityCached', { isbn13: b.isbn, bookId: b.id });
    renderAvailLibs_(b, libs);
  }catch(err){ box.innerHTML = '<div class="empty-msg" style="padding:2px 0;text-align:left;">도서관 정보를 못 불러왔어요.</div>'; }
}
async function borrowThis(userBookId, checkbox){
  checkbox.disabled = true;
  const card = checkbox.closest('.book-card');
  if(card) card.style.display = 'none'; // 즉시 화면에서 숨김(결과 기다리는 동안 어색하게 남아있지 않도록)
  try{
    await apiPost('markBorrowed_toReading', { userBookId });
    wantCache = wantCache.filter(b => b.userBook.id !== userBookId);
    renderWantCount();
    if(card) card.remove();
    loadReading();
  }catch(err){
    showApiError(err);
    checkbox.disabled=false; checkbox.checked=false;
    if(card) card.style.display = '';
  }
}
async function removeWantThis(userBookId, btn){
  btn.closest('.kebab-menu').classList.remove('open');
  if(!confirm('이 책을 목록에서 삭제할까요?')) return;
  const card = btn.closest('.book-card');
  try{
    await apiPost('removeUserBook', { userBookId });
    wantCache = wantCache.filter(b => b.userBook.id !== userBookId);
    renderWantCount();
    if(card) card.remove();
  }catch(err){ showApiError(err); }
}
async function saveReason(userBookId, value){

}
/* 내용이 없으면 칸을 1줄로 줄이고, 내용이 있으면 원래 줄 수로 되돌림 */
function reasonRowsAttr_(value, fullRows){
  const has = value && String(value).trim();
  return `rows="${has ? fullRows : 1}" data-full-rows="${fullRows}"`;
}
function adjustReasonRows_(textarea){
  const fullRows = Number(textarea.dataset.fullRows) || 2;
  textarea.rows = textarea.value.trim() ? fullRows : 1;
}

  menu.classList.toggle('open');
}

let editCtx_ = null; // { kind: 'want'|'reading'|'done', userBookId, bookId }
function openEditModal(kind, userBookId, bookId, title, author, readDate){
  editCtx_ = { kind, userBookId, bookId };
  document.getElementById('rec-title-input').value = title || '';
  document.getElementById('rec-author-input').value = author || '';
  document.getElementById('rec-date-block').style.display = kind === 'done' ? '' : 'none';
  if(kind === 'done'){

  }
  document.getElementById('record-overlay').classList.add('active');

function closeRecord(){ document.getElementById('record-overlay').classList.remove('active'); }
function openEditForWant(userBookId){
  const b = wantCache.find(x=>x.userBook.id===userBookId);
  if(b) openEditModal('want', b.userBook.id, b.id, b.title, b.author);

function openEditForReading(userBookId){
  const b = readingCache.find(x=>x.userBook.id===userBookId);
  if(b) openEditModal('reading', b.userBook.id, b.id, b.title, b.author);
}
function openEditForDone(userBookId){
  const b = doneCache.find(x=>x.userBook.id===userBookId);
  if(b) openEditModal('done', b.userBook.id, b.id, b.title, b.author, b.userBook.read_date);

async function confirmEdit(){
  if(!editCtx_) return;
  const title = document.getElementById('rec-title-input').value.trim();
  const author = document.getElementById('rec-author-input').value.trim();
  try{
    await apiPost('updateBookInfo', { bookId: editCtx_.bookId, title, author });
    if(editCtx_.kind === 'done'){
      const readDate = parseShortDateStr_(document.getElementById('rec-date').value);
      await apiPost('updateReadDate', { userBookId: editCtx_.userBookId, readDate });
    }
    closeRecord();
    if(editCtx_.kind === 'want') loadWant();
    else if(editCtx_.kind === 'reading') loadReading();
    else { refreshParts_(['done','stats']); }
  }catch(err){ showApiError(err); }
}

/* ============ 읽었어용 ============ */
let doneCache = [];
/* read_date는 정상적으로는 'YYYY-MM-DD'(또는 ISO) 문자열이지만, 과거 일부 데이터가
   숫자(YYYYMMDD)로 잘못 저장된 적이 있어 방어적으로 문자열로 정규화해서 사용 */
function normalizeDateVal_(v){
  if(v === null || v === undefined || v === '') return '';
  if(typeof v === 'number'){
    const s = String(v);
    return s.length === 8 ? (s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)) : '';
  }
  return String(v);
}
function doneYearKey_(b){
  return b.userBook.dropped ? '중도포기' : normalizeDateVal_(b.userBook.read_date).slice(0,4);
}
function formatShortDate_(dateStr){
  dateStr = normalizeDateVal_(dateStr);
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return '';
  return (d.getMonth()+1) + '.' + d.getDate();
}
function doneCardHtml(b){
  return `
    <div class="book-card ${b.userBook.dropped?'dropped':''}" data-user-book-id="${b.userBook.id}" onclick="openDetail('done', ${b.userBook.id})">
      <div class="cover-col">
        <img class="cover" src="${b.cover_url||''}" alt="">
        <div class="kebab-wrap">
          <button class="kebab-btn" onclick="event.stopPropagation();toggleKebab(this)">⋯</button>
          <div class="kebab-menu">
            <button onclick="this.closest('.kebab-menu').classList.remove('open');openEditForDone(${b.userBook.id})">수정</button>
            <button class="danger-opt" onclick="removeDoneThis(${b.userBook.id})">삭제</button>
          </div>
        </div>
      </div>

        <div class="book-title">${escapeHtml(b.title)}</div>
        <div class="book-author-year">${escapeHtml(b.author)}</div>

        <div class="reason-input" onclick="event.stopPropagation()">
          <textarea ${reasonRowsAttr_(b.userBook.reason_note, 3)} placeholder="감상 메모" oninput="adjustReasonRows_(this)" onblur="saveReason(${b.userBook.id}, this.value)">${escapeHtml(b.userBook.reason_note)}</textarea>
        </div>
      </div>
    </div>
  `;

async function loadDone(preloaded){
  const grid = document.getElementById('done-list');
  try{
    const list = preloaded || await apiGet('getDoneList');
    doneCache = list;
    if(!list.length){ grid.innerHTML = '<div class="empty-msg">아직 읽은 책이 없어요.</div>'; document.getElementById('done-year-select').innerHTML=''; document.getElementById('done-count').textContent=''; return; }
    const years = [...new Set(list.map(doneYearKey_))].filter(Boolean).sort().reverse();
    const sel = document.getElementById('done-year-select');
    const prevValue = sel.value;
    sel.innerHTML = years.map(y=>`<option value="${y}">${y==='중도포기'?'중도포기':y+'년'}</option>`).join('');
    const toSelect = years.indexOf(prevValue) !== -1 ? prevValue : (years[0]||'');
    sel.value = toSelect;
    renderDoneYear(toSelect);
  }catch(err){ showApiError(err); grid.innerHTML = '<div class="empty-msg">불러오지 못했어요.</div>'; }
}
function renderDoneYear(year){
  const grid = document.getElementById('done-list');
  const list = doneCache.filter(b => doneYearKey_(b) === year);
  document.getElementById('done-count').textContent = list.length + '권';
  if(!list.length){ grid.innerHTML = '<div class="empty-msg">이 해에 읽은 책이 없어요.</div>'; return; }
  if(year === '중도포기'){
    grid.innerHTML = list.map(doneCardHtml).join('');
    return;
  }
  const groups = {};
  list.forEach(b=>{
    const d = new Date(normalizeDateVal_(b.userBook.read_date));
    const m = isNaN(d) ? 0 : d.getMonth()+1;
    (groups[m] = groups[m] || []).push(b);
  });
  const months = Object.keys(groups).map(Number).sort((a,b)=>b-a);
  grid.innerHTML = months.map(m => `
    <div class="month-divider">${m===0?'날짜없음':m+'월'} <span class="month-divider-count">${groups[m].length}권</span></div>
    ${groups[m].map(doneCardHtml).join('')}
  `).join('');
}

/* ============ 종합해용 ============ */
async function loadStats(preloadedStats, preloadedDone){
  try{
    const s = preloadedStats || await apiGet('getStats');
    document.getElementById('stat-done').textContent = s.doneThisYear;
    document.getElementById('stat-want').textContent = s.wantCount;
    const total = (s.categoryCounts['소설']||0) + (s.categoryCounts['비소설']||0);
    const pct = (n)=> total ? Math.round(n/total*100) : 0;
    document.getElementById('category-bars').innerHTML = `
      <div class="category-bar-row"><span class="lbl">소설</span><div class="track"><div class="fill" style="width:${pct(s.categoryCounts['소설'])}%"></div></div><span class="pct">${pct(s.categoryCounts['소설'])}%</span></div>
      <div class="category-bar-row"><span class="lbl">비소설</span><div class="track"><div class="fill" style="width:${pct(s.categoryCounts['비소설'])}%"></div></div><span class="pct">${pct(s.categoryCounts['비소설'])}%</span></div>
    `;
  }catch(err){ showApiError(err); }

  try{
    const done = preloadedDone || await apiGet('getDoneList');
    const now = new Date();
    const currentYear = now.getFullYear();
    const finished = done.filter(b => !b.userBook.dropped && b.userBook.read_date);
    const yearsSet = new Set(finished.map(b => new Date(normalizeDateVal_(b.userBook.read_date)).getFullYear()));
    yearsSet.add(currentYear);
    const years = [...yearsSet].sort((a,b)=>b-a); // 최신 연도부터

    const yearMonthCounts = years.map(year=>{
      const monthCounts = Array(12).fill(0);
      finished.forEach(b=>{
        const d = new Date(normalizeDateVal_(b.userBook.read_date));
        if(d.getFullYear() === year) monthCounts[d.getMonth()]++;
      });
      return { year, monthCounts };
    });
    const maxCount = Math.max(1, ...yearMonthCounts.flatMap(y=>y.monthCounts));

    let gridHtml = '<span></span>' +
      Array.from({length:12}, (_,i)=>`<span class="mt-mlabel">${i+1}</span>`).join('') +
      '<span class="mt-thead">계</span>';
    yearMonthCounts.forEach(({year, monthCounts})=>{
      gridHtml += `<span class="mt-ylabel">${String(year).slice(2)}년</span>`;
      monthCounts.forEach((c,i)=>{
        if(year === currentYear && i > now.getMonth()){ gridHtml += '<div class="mt-cell"></div>'; return; }
        const alpha = c === 0 ? 0.06 : 0.18 + (c / maxCount) * 0.72;
        const textColor = alpha > 0.5 ? '#fff' : 'var(--ink-soft)';
        gridHtml += `<div class="mt-cell" style="background:rgba(184,33,94,${alpha.toFixed(2)});color:${textColor};">${c || ''}</div>`;
      });
      gridHtml += `<div class="mt-total">${monthCounts.reduce((a,b)=>a+b,0)}</div>`;
    });
    document.getElementById('mt-grid').innerHTML = gridHtml;
  }catch(err){ showApiError(err); }
}

/* ============ 도서관 지점 (읽을래용 필터) ============ */
const ALWAYS_VISIBLE_BRANCHES = ['남사','용인중앙'];
let branchListExpanded = false;
let branchNamesCache = [];

async function loadBranches(preloaded){

function renderBranchRow_(){
  const row = document.getElementById('branch-row');
  row.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'chip-select' + (activeBranchFilter===null ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.addEventListener('click', ()=>{ activeBranchFilter = null; renderBranchRow_(); applyBranchFilter(); });
  row.appendChild(allBtn);

  const toShow = branchListExpanded
    ? branchNamesCache
    : branchNamesCache.filter(n => ALWAYS_VISIBLE_BRANCHES.indexOf(n) !== -1);

  toShow.forEach(name=>{
    const btn = document.createElement('button');
    btn.className = 'chip-select' + (activeBranchFilter===name ? ' active' : '');
    btn.textContent = name;
    btn.draggable = true;
    btn.addEventListener('click', ()=>{ activeBranchFilter = name; renderBranchRow_(); applyBranchFilter(); });
    row.appendChild(btn);
  });

  const moreBtn = document.createElement('button');
  moreBtn.className = 'more-branch-btn';
  moreBtn.textContent = branchListExpanded ? '접기' : '더보기';
  moreBtn.addEventListener('click', ()=>{ branchListExpanded = !branchListExpanded; renderBranchRow_(); });
  row.appendChild(moreBtn);

  renderWantCount();

  if(branchListExpanded) initBranchDrag_(row);
}

function findWantBook_(userBookId){
  return wantCache.find(b => String(b.userBook.id) === String(userBookId));
}
function callnoCompare_(a, b){
  if(!a && !b) return 0;
  if(!a) return 1;
  if(!b) return -1;
  return a.localeCompare(b, undefined, {numeric:true});
}
/* 전체(필터 없음)일 땐 최근 추가한 책이 맨 앞, 특정 도서관 필터일 땐 그 도서관 보유 책만 청구기호순으로 정렬.
   카드 DOM은 재사용(appendChild로 순서만 옮김)해서 이미 불러온 도서관 정보 표시가 지워지지 않게 함 */
function updateCallnoTags_(){
  document.querySelectorAll('#book-grid .book-card').forEach(card=>{
    const tag = document.getElementById('callno-'+card.dataset.userBookId);
    if(!tag) return;
    const callnos = bookCallnoMap[card.dataset.bookId];
    const cn = activeBranchFilter && callnos ? callnos[activeBranchFilter] : '';
    tag.textContent = cn ? `${activeBranchFilter} 청구기호 ${cn}` : '';
  });
}

/* 청구기호순 정렬용: 도서관 필터가 걸려있으면 그 도서관 청구기호, 아니면 알고 있는 청구기호 중 아무거나 사용 */
function callnoForSort_(bookId){
  const map = bookCallnoMap[bookId] || {};
  if(activeBranchFilter && map[activeBranchFilter]) return map[activeBranchFilter];
  const vals = Object.keys(map).map(k=>map[k]).filter(Boolean);
  return vals[0] || '';
}
function applyBranchFilter(){
  const grid = document.getElementById('book-grid');
  const cards = [...grid.querySelectorAll('.book-card')];

  cards.forEach(card=>{
    if(activeBranchFilter === null){ card.style.display = ''; return; }
    const libs = bookLibrariesMap[card.dataset.bookId];
    const owns = Array.isArray(libs) && libs.indexOf(activeBranchFilter) !== -1;
    card.style.display = owns ? '' : 'none';
  });

  const visible = cards.filter(c=>c.style.display !== 'none');
  visible.sort((c1,c2)=>{
    const b1 = findWantBook_(c1.dataset.userBookId), b2 = findWantBook_(c2.dataset.userBookId);
    switch(wantSortMode){
      case 'title_asc': return (b1&&b1.title||'').localeCompare(b2&&b2.title||'', 'ko');
      case 'title_desc': return (b2&&b2.title||'').localeCompare(b1&&b1.title||'', 'ko');
      case 'added_asc': return new Date((b1&&b1.userBook.added_date)||0) - new Date((b2&&b2.userBook.added_date)||0);
      case 'callno_asc': return callnoCompare_(callnoForSort_(c1.dataset.bookId), callnoForSort_(c2.dataset.bookId));
      case 'callno_desc': return callnoCompare_(callnoForSort_(c2.dataset.bookId), callnoForSort_(c1.dataset.bookId));
      case 'added_desc':
      default: return new Date((b2&&b2.userBook.added_date)||0) - new Date((b1&&b1.userBook.added_date)||0);
    }
  });
  visible.forEach(c=>grid.appendChild(c));
  updateCallnoTags_();
}

function initBranchDrag_(row){
  let dragEl = null;
  row.querySelectorAll('.chip-select[draggable="true"]').forEach(btn=>{
    btn.addEventListener('dragstart', ()=>{
      dragEl = btn;
      btn.classList.add('dragging');
    });
    btn.addEventListener('dragend', ()=>{
      btn.classList.remove('dragging');
      dragEl = null;
      saveBranchOrder_(row);
    });
  });
  row.addEventListener('dragover', (e)=>{
    e.preventDefault();
    if(!dragEl) return;
    // X, Y 둘 다 고려해서 가장 가까운 칩 옆으로 옮김(줄바꿈 있어도 정상 동작하도록)
    const candidates = [...row.querySelectorAll('.chip-select[draggable="true"]:not(.dragging)')];
    let closest = null, closestDist = Infinity, closestBefore = true;
    candidates.forEach(c=>{
      const rect = c.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if(dist < closestDist){
        closestDist = dist;
        closest = c;
        closestBefore = e.clientX < cx;
      }
    });
    if(!closest) return;
    if(closestBefore) row.insertBefore(dragEl, closest);
    else row.insertBefore(dragEl, closest.nextSibling);
  });
}

async function saveBranchOrder_(row){
  const orderedNames = [...row.querySelectorAll('.chip-select[draggable="true"]')].map(c=>c.textContent);
  try{
    await apiPost('updateBranchOrder', { orderedNames });
    branchNamesCache = orderedNames;
  }catch(err){ showApiError(err); }
}

/* 카메라를 켜는 도중(권한 대기/기기 전환 등 await 사이)에 모달을 닫거나 카메라를 바꾸면

let scanSession_ = 0;
let scanNudgeTimers_ = [];

const SCAN_HINT_DEFAULT = '바코드가 화면 가로폭의 2/3 정도 되게, 수평으로 비춰주세요';
function restartScan(){

function stopScanCamera_(){
  scanSession_++;   // 진행 중이던 startScanCamera_가 있으면 그쪽 결과를 무효화
  scanNudgeTimers_.forEach(clearTimeout); scanNudgeTimers_ = [];

/* 연속 자동인식이 잘 안 될 때: 지금 화면의 한 프레임을 정지사진처럼 캡처해서 별도 리더로 인식 시도
   (연속 스캔은 저조도/블러에 약한데, 캡처는 사용자가 초점 맞을 때를 골라 찍을 수 있어 성공률이 더 높음) */
/* 정지 이미지(캡처/촬영 결과)에서 바코드 텍스트 추출. 못 찾으면 null.
   ZXing의 decodeFromImageUrl은 완전히 동일한 이미지를 여러 번 디코딩해도 성공/실패가 들쭉날쭉한
   버그가 있음(직접 반복 테스트로 확인 — 같은 이미지 5번 중 3번 성공, 2번 실패). 그래서 실패해도
   바로 포기하지 않고 몇 번 더 재시도함(포맷 제한은 안 함 — 제한하면 오히려 더 자주 실패함). */
/* 원본이 너무 크면(폰 카메라 사진은 보통 3000px 이상) 적당한 크기로 줄여서 디코드 대상으로 씀 —
   너무 큰 이미지가 디코드 성공률/속도에 안 좋을 수 있어서. 줄인 버전으로 dataURL 다시 만듦 */
async function normalizeImageForDecode_(dataUrl){
  const img = new Image();
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataUrl; });
  const maxW = 1600;
  if(img.naturalWidth <= maxW) return dataUrl;
  const scale = maxW / img.naturalWidth;
  const canvas = document.createElement('canvas');
  canvas.width = maxW;
  canvas.height = Math.round(img.naturalHeight * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.92);
}
/* 폰 브라우저(주로 Android Chrome)에 내장된 하드웨어 바코드 인식기 — zxing.js 라이브러리보다
   훨씬 안정적임(zxing.js는 같은 이미지도 확률적으로 실패하는 버그가 있는 걸 직접 확인함).
   지원 안 되면(null 리턴) zxing 재시도 루프로 폴백함. */
async function tryNativeBarcodeDetect_(dataUrl){
  if(typeof BarcodeDetector === 'undefined') return null;
  try{
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataUrl; });
    const detector = new BarcodeDetector({ formats: ['ean_13', 'upc_a'] });
    const codes = await detector.detect(img);
    for(const c of codes){
      const text = String(c.rawValue || '').replace(/[^0-9]/g, '');
      if(/^\d{12,13}$/.test(text)) return text.length === 12 ? '0' + text : text;
    }
    return null;
  }catch(err){ return null; }
}
async function decodeImageDataUrl_(dataUrl){
  const native = await tryNativeBarcodeDetect_(dataUrl);
  if(native) return native;

  const normalized = await normalizeImageForDecode_(dataUrl).catch(() => dataUrl);
  for(let attempt = 0; attempt < 10; attempt++){
    try{
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      const target = attempt % 3 === 0 ? dataUrl : normalized; // 가끔 원본 해상도로도 시도
      const result = await reader.decodeFromImageUrl(target);
      const text = result.getText();
      if(/^\d{12,13}$/.test(text)) return text.length === 12 ? '0' + text : text;
    }catch(err){ /* 이번 시도만 실패, 다음 시도로 */ }
  }
  return null;
}
/* 인식 실패 시 방금 분석한 사진을 화면에 보여줌 — 카메라/사진 자체를 직접 볼 수 없는 상황에서
   사용자가 프레이밍(잘림/기울기/초점) 문제를 스스로 확인할 수 있게 하기 위함 */
function showScanDebugImage_(dataUrl){
  document.getElementById('scan-debug-img').src = dataUrl;
  document.getElementById('scan-debug-wrap').style.display = 'block';
}
function hideScanDebugImage_(){
  document.getElementById('scan-debug-wrap').style.display = 'none';
}
async function captureAndDecode_(){
  const video = document.getElementById('scan-video');
  const hint = document.getElementById('scan-hint');
  if(!video.videoWidth){ hint.textContent = '카메라가 아직 준비되지 않았어요. 잠시 후 다시 시도해주세요.'; return; }
  hint.textContent = '인식 중...';
  hideScanDebugImage_();
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const isbn13 = await decodeImageDataUrl_(dataUrl);
  if(isbn13){
    stopScanCamera_();
    lookupScannedIsbn(isbn13);
    return;
  }
  hint.textContent = '바코드를 못 찾았어요. 다시 조준하고 캡처해주세요.';
  showScanDebugImage_(dataUrl);
}
/* 폰 기본 카메라 앱으로 찍은 사진(제대로 된 자동초점 사용)에서 인식 —
   getUserMedia 실시간 미리보기는 매크로(근접) 초점을 잘 못 잡는 폰이 많아서, 훨씬 안정적인 대안 */
async function handleNativeCapture_(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const hint = document.getElementById('scan-hint');
  hint.textContent = '사진에서 인식 중...';
  hideScanDebugImage_();
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const isbn13 = await decodeImageDataUrl_(dataUrl);
    input.value = '';
    if(isbn13){
      stopScanCamera_();
      lookupScannedIsbn(isbn13);
      return;
    }
    hint.textContent = '사진에서 바코드를 못 찾았어요. 바코드 전체가 화면에서 잘리지 않고, 수평으로, 크고 선명하게 나오도록 다시 찍어주세요.';
    showScanDebugImage_(dataUrl);
  };
  reader.readAsDataURL(file);
}
/* 화면 탭하면 그 지점으로 초점을 맞추도록 시도.
   예전 버전은 pointsOfInterest(초점을 맞출 좌표)를 안 넘기고 focusMode만 바꿨고, 지원이 안 되면
   조용히 아무것도 안 해서 "탭해도 아무 반응 없음"으로만 보였음. 이제 좌표를 같이 넘기고,
   지원 안 되는 기기에서는 그 사실을 안내 문구로 알려줌(고정초점 렌즈면 줌/카메라 변경으로 유도). */
function setScanHint_(msg){ document.getElementById('scan-hint').textContent = msg; }
async function tapToFocus_(e){
  const rect = e.currentTarget.getBoundingClientRect();
  const ring = document.createElement('div');
  ring.className = 'focus-ring';
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  ring.style.left = px + 'px';
  ring.style.top = py + 'px';
  e.currentTarget.appendChild(ring);
  setTimeout(() => ring.remove(), 650);

  if(!currentStream_) return;
  const track = currentStream_.getVideoTracks()[0];
  if(!track || typeof track.getCapabilities !== 'function') return;
  const caps = track.getCapabilities();
  const advanced = [];
  /* 탭 좌표를 0~1로 정규화해서 전달 (object-fit:cover라 약간의 오차는 있지만 초점 영역 지정엔 충분) */
  if(caps.pointsOfInterest){
    advanced.push({ pointsOfInterest: [{ x: Math.min(1, Math.max(0, px / rect.width)),
                                         y: Math.min(1, Math.max(0, py / rect.height)) }] });
  }
  if(caps.focusMode && caps.focusMode.includes('single-shot')) advanced.push({ focusMode: 'single-shot' });
  else if(caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });

  if(!advanced.length){
    setScanHint_('이 카메라는 초점 조절을 지원하지 않아요(고정초점 렌즈일 수 있어요). 아래에서 다른 카메라를 골라보거나, 폰을 30cm 이상 떼고 줌을 당겨보세요.');
    return;
  }
  try{
    await track.applyConstraints({ advanced });
    setScanHint_('초점 맞추는 중...');
    setTimeout(() => setScanHint_(SCAN_HINT_DEFAULT), 1200);
  }catch(err){
    setScanHint_('초점 조절이 이 기기에선 안 돼요(' + (err.name||'오류') + '). 폰을 30cm 이상 떼고 줌을 당겨보세요.');
  }
}
/* ---- 카메라 선택 ----
   facingMode:'environment'만 요청하면 브라우저가 후면 카메라 중 아무거나 고르는데, 요즘 폰은 후면에
   메인/초광각/망원이 여러 개 있고 초광각은 대부분 '고정초점(AF 모터 없음)'이라 근접 촬영에서
   절대 선명해지지 않음(탭 투 포커스도 무시됨). 그래서 실제 기기 목록을 열거해서 메인 카메라를
   고르고, 추정이 틀릴 수 있으니 사용자가 직접 바꿀 수 있는 드롭다운도 제공함. */
const SCAN_CAM_KEY = 'ilgeoyong_scan_camera_id';
function scoreBackCamera_(label){
  const s = (label || '').toLowerCase();
  let score = 0;
  if(/front|user|전면|셀피|selfie/.test(s)) return -100;          // 전면 카메라는 제외
  if(/back|rear|후면|environment/.test(s)) score += 10;
  if(/ultra|초광각|wide.?angle|0\.5/.test(s)) score -= 8;          // 초광각 = 고정초점인 경우가 많음
  if(/tele|망원|zoom lens/.test(s)) score -= 6;                    // 망원은 근접 최소초점거리가 김
  if(/depth|심도|mono|적외선|ir\b/.test(s)) score -= 20;           // 촬영용이 아님
  if(/macro|매크로/.test(s)) score += 6;                           // 있으면 근접에 최적
  if(/camera2 0|\b0,/.test(s)) score += 3;                         // 안드로이드는 보통 0번이 메인
  return score;
}
async function listBackCameras_(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === 'videoinput' && scoreBackCamera_(d.label) > -50);
  }catch(err){ return []; }
}
function switchScanCamera_(deviceId){
  if(!deviceId) return;
  try{ localStorage.setItem(SCAN_CAM_KEY, deviceId); }catch(e){}
  stopScanCamera_();
  startScanCamera_(deviceId);
}
function applyScanZoom_(value){
  document.getElementById('scan-zoom-val').textContent = Number(value).toFixed(1) + 'x';
  if(!currentStream_) return;
  const track = currentStream_.getVideoTracks()[0];
  if(!track) return;
  track.applyConstraints({ advanced: [{ zoom: Number(value) }] }).catch(()=>{});
}
function toggleScanTorch_(){
  if(!currentStream_) return;
  const track = currentStream_.getVideoTracks()[0];
  if(!track) return;
  const btn = document.getElementById('scan-torch-btn');
  const turnOn = !btn.classList.contains('on');
  track.applyConstraints({ advanced: [{ torch: turnOn }] })
    .then(() => btn.classList.toggle('on', turnOn))
    .catch(() => setScanHint_('이 기기는 플래시 제어를 지원하지 않아요.'));
}
/* 초점 관련 제어가 가능하면 근접 촬영에 유리하게 미리 맞춰둠 */
async function applyFocusTuning_(track){
  const caps = (typeof track.getCapabilities === 'function') ? track.getCapabilities() : {};
  if(caps.focusMode && caps.focusMode.includes('continuous')){
    try{ await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); }catch(e){}
  } else if(caps.focusMode && caps.focusMode.includes('manual') && caps.focusDistance){
    /* 연속 AF가 없고 수동 초점만 되는 기기 — 최단 초점거리(가장 가까이)로 맞춰 매크로처럼 씀 */
    try{
      await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: caps.focusDistance.min }] });
    }catch(e){}
  }
}
/* 카메라 목록/줌/플래시 컨트롤을 실제 지원 여부에 맞춰 구성 */
async function setupCameraControls_(track){
  const caps = (typeof track.getCapabilities === 'function') ? track.getCapabilities() : {};
  const settings = (typeof track.getSettings === 'function') ? track.getSettings() : {};

  const cams = await listBackCameras_();
  const camRow = document.getElementById('scan-cam-row');
  const sel = document.getElementById('scan-cam-select');
  if(cams.length > 1){
    sel.innerHTML = cams.map((d, i) =>
      `<option value="${escapeHtml(d.deviceId)}">${escapeHtml(d.label || ('카메라 ' + (i+1)))}</option>`).join('');
    if(settings.deviceId) sel.value = settings.deviceId;
    camRow.style.display = 'flex';
  } else {
    camRow.style.display = 'none';
  }

  const zoomRow = document.getElementById('scan-zoom-row');
  const range = document.getElementById('scan-zoom-range');
  if(caps.zoom){
    range.min = caps.zoom.min;
    range.max = caps.zoom.max;
    range.step = caps.zoom.step || 0.1;
    range.value = settings.zoom || caps.zoom.min;
    document.getElementById('scan-zoom-val').textContent = Number(range.value).toFixed(1) + 'x';
    zoomRow.style.display = 'flex';
  } else {
    zoomRow.style.display = 'none';
  }
  const torchBtn = document.getElementById('scan-torch-btn');
  torchBtn.classList.remove('on');
  if(caps.torch){
    torchBtn.style.display = 'block';
    zoomRow.style.display = 'flex';   // 줌이 없어도 플래시 버튼은 보이게
  } else {
    torchBtn.style.display = 'none';
  }

  renderScanDiag_(track, caps, settings, cams);
}
/* 원격으로 사용자 폰 카메라를 볼 수 없으니, 실제로 어떤 카메라가 어떤 성능으로 열렸는지를
   화면에 찍어줌 — 인식이 안 될 때 이 내용을 스크린샷으로 받으면 바로 진단이 됨 */
function renderScanDiag_(track, caps, settings, cams){
  const lines = [];
  lines.push('카메라: ' + (track.label || '(이름 없음)'));
  lines.push('해상도: ' + (settings.width || '?') + '×' + (settings.height || '?'));
  lines.push('후면 카메라 개수: ' + (cams.length || '?'));
  lines.push('하드웨어 인식기: ' + (typeof BarcodeDetector !== 'undefined' ? '있음' : '없음(zxing 사용)'));
  lines.push('초점모드: ' + (caps.focusMode ? caps.focusMode.join('/') : '제어 불가'));
  lines.push('초점거리조절: ' + (caps.focusDistance ? '가능' : '불가'));
  lines.push('탭 초점(POI): ' + (caps.pointsOfInterest ? '가능' : '불가'));
  lines.push('줌: ' + (caps.zoom ? caps.zoom.min + '~' + caps.zoom.max : '불가'));
  lines.push('플래시: ' + (caps.torch ? '가능' : '불가'));
  document.getElementById('scan-diag').textContent = lines.join('\n');
}
/* 실시간 스캔도 네이티브 BarcodeDetector가 있으면 그걸 우선 사용(직접 getUserMedia로 스트림을 얻어
   video에 붙이고, setInterval로 프레임을 주기적으로 검사). 없으면 zxing의 decodeContinuously로 폴백 —
   이때도 이미 붙여놓은 같은 스트림을 재사용해서(attachStreamToVideo) getUserMedia를 두 번 부르지 않음. */
async function startScanCamera_(preferredDeviceId){
  const hint = document.getElementById('scan-hint');
  const video = document.getElementById('scan-video');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    hint.textContent = '이 브라우저는 카메라를 지원하지 않아요. 직접 ISBN을 입력해주세요.';
    return;
  }
  const mySession = ++scanSession_;
  const stale_ = (s) => {
    if(mySession === scanSession_) return false;
    if(s) s.getTracks().forEach(t => t.stop());   // 그 사이 닫혔음 — 늦게 열린 스트림은 바로 정리
    return true;
  };
  let savedId = preferredDeviceId;
  if(!savedId){ try{ savedId = localStorage.getItem(SCAN_CAM_KEY) || ''; }catch(e){ savedId = ''; } }
  const baseVideo = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  try{
    let stream = null;
    if(savedId){
      /* 저장/선택된 카메라를 정확히 지정해서 열기 — 실패하면(기기 바뀜 등) 아래 기본 방식으로 폴백 */
      try{
        stream = await navigator.mediaDevices.getUserMedia(
          { video: Object.assign({ deviceId: { exact: savedId } }, baseVideo) });
      }catch(err){ stream = null; }
    }
    if(!stream){
      stream = await navigator.mediaDevices.getUserMedia(
        { video: Object.assign({ facingMode: 'environment' }, baseVideo) });
    }
    if(stale_(stream)) return;
    currentStream_ = stream;
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('scan-viewfinder').classList.add('live');
    /* play()를 await하지 않음 — 카메라가 첫 프레임을 늦게 주면 그 promise가 오래 걸려서
       뒤따르는 초점 설정/컨트롤 표시까지 통째로 늦어짐(video에 autoplay가 걸려 있어 재생은 됨) */
    video.play().catch(()=>{});
    document.getElementById('scan-capture-btn').style.display = 'block';

    let track = stream.getVideoTracks()[0];
    /* 처음 켤 때(저장된 선택이 없을 때)는 브라우저가 초광각 같은 고정초점 카메라를 골랐을 수 있으므로,
       권한이 생긴 지금 기기 목록을 다시 읽어서 근접 촬영에 제일 나은 카메라로 한 번 갈아탐 */
    if(!savedId){
      const cams = await listBackCameras_();
      if(cams.length > 1){
        const best = cams.slice().sort((a, b) => scoreBackCamera_(b.label) - scoreBackCamera_(a.label))[0];
        const nowId = (typeof track.getSettings === 'function') ? track.getSettings().deviceId : '';
        if(best && best.deviceId && best.deviceId !== nowId){
          try{
            const better = await navigator.mediaDevices.getUserMedia(
              { video: Object.assign({ deviceId: { exact: best.deviceId } }, baseVideo) });
            if(stale_(better)) return;
            stream.getTracks().forEach(t => t.stop());
            currentStream_ = better;
            video.srcObject = better;
            video.play().catch(()=>{});
            track = better.getVideoTracks()[0];
            try{ localStorage.setItem(SCAN_CAM_KEY, best.deviceId); }catch(e){}
          }catch(err){ /* 갈아타기 실패 — 원래 스트림 그대로 사용 */ }
        }
      }
    }
    await applyFocusTuning_(track);
    setupCameraControls_(track).catch(()=>{});
    /* 한참 인식이 안 되면 대개 초점 문제 — 흐릿한 채로 계속 들이대지 말고 거리를 벌리도록 유도 */
    scanNudgeTimers_ = [
      setTimeout(() => setScanHint_('잘 안 되면 화면을 한 번 탭해서 초점을 맞춰보세요'), 7000),
      setTimeout(() => setScanHint_('아직 흐릿한가요? 폰을 30cm 이상 떼고 아래 줌으로 당겨보세요'), 15000)
    ];

    if(typeof BarcodeDetector !== 'undefined'){
      const detector = new BarcodeDetector({ formats: ['ean_13', 'upc_a'] });
      nativePollTimer_ = setInterval(async () => {
        if(!video.videoWidth) return;
        try{
          const codes = await detector.detect(video);
          for(const c of codes){
            const text = String(c.rawValue || '').replace(/[^0-9]/g, '');
            if(/^\d{12,13}$/.test(text)){
              stopScanCamera_();
              lookupScannedIsbn(text.length === 12 ? '0' + text : text);
              return;
            }
          }
        }catch(e){ /* 이번 프레임만 건너뜀 */ }
      }, 350);
    } else if(typeof ZXing !== 'undefined'){
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      zxingReader_ = new ZXing.BrowserMultiFormatReader(hints, 150);
      zxingReader_.decodeContinuously(video, (result) => {
        if(!result) return;
        const text = result.getText();
        if(/^\d{12,13}$/.test(text)){
          stopScanCamera_();
          lookupScannedIsbn(text.length === 12 ? '0' + text : text);
        }
      });
    } else {
      hint.textContent = '바코드 인식 기능을 불러오지 못했어요. 직접 ISBN을 입력해주세요.';
    }
  }catch(err){
    console.error(err);
    hint.textContent = '카메라를 열 수 없어요. 직접 ISBN을 입력해주세요.';
  }
}
async function lookupScannedIsbn(rawIsbn){
  const isbn13 = String(rawIsbn||'').replace(/[^0-9Xx]/g,'');
  if(isbn13.length !== 13){ alert('ISBN 13자리를 정확히 입력해주세요.'); return; }
  stopScanCamera_();
  document.getElementById('scan-state').style.display = 'none';
  document.getElementById('scan-manual').style.display = 'none';
  document.getElementById('scan-found').style.display = 'none';
  try{
    const item = await apiGet('lookupByIsbn', { isbn13 });
    if(!item){ alert('해당 ISBN으로 책을 찾지 못했어요.'); restartScan(); return; }
    scanCache_ = item;
    showScanFound();
  }catch(err){ showApiError(err); restartScan(); }
}
function showScanFound(){
  const item = scanCache_;
  document.getElementById('scan-state').style.display = 'none';
  document.getElementById('scan-manual').style.display = 'none';
  document.getElementById('scan-found').style.display = 'block';
  document.getElementById('scan-found-cover').src = item.cover || '';
  document.getElementById('scan-found-title').textContent = item.title;
  document.getElementById('scan-found-author').textContent = (item.author||'') + (item.pubDate ? ' · ' + item.pubDate.slice(0,4) : '');
  const view = activeTabView_();
  document.getElementById('scan-found-addbtn').textContent = view === 'reading' ? '+ 읽는중 추가' : view === 'done' ? '+ 읽음 추가' : '+ 담기';
}
async function addScannedBook(){
  const item = scanCache_;
  if(!item) return;
  const view = activeTabView_();
  if(view === 'done'){
    closeBarcode();
    searchCache = [item];
    openDoneAdd(0);
    return;
  }
  await runAddOnce_(async () => {
    if(view === 'reading'){
      await apiPost('addToReadingList', { bookData: item, reasonNote: '' });
      loadReading();
    } else {
      await apiPost('addToWantList', { bookData: item, reasonNote: '' });
      loadWant();
    }
    closeBarcode();
  });
}

/* ============ 초기 로드 ============ */
initialLoad_();
</script>
